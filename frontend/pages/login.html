<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Soto Rent Car</title>
    <meta name="description" content="Inicia sesión en Soto Rent Car para gestionar tus reservas y acceder a nuestros servicios.">
    <meta name="author" content="Soto Rent Car">
    <link rel="icon" type="image/png" href="/assets/img/ChatGPT Image 11 may 2026, 22_47_30.png">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <main class="login-container">
        <div class="login-logo">
            <a href="../index.html">
                <img src="/assets/img/ChatGPT Image 11 may 2026, 22_47_30.png" alt="Soto Rent Car">
            </a>
        </div>

        <section class="login-card">
            <div class="login-header">
                <p class="login-subtitle">SOTO RENT CAR</p>
                <h1>Iniciar sesión</h1>
                <p>Accede a tu cuenta para continuar.</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@gmail.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox" id="recordar">
                        <span>Recordarme</span>
                    </label>
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="login-button" id="login-btn">
                    Iniciar sesión
                </button>

                <p id="login-message" class="login-message"></p>
            </form>

            <div class="back-home">
                <a href="registro.html">¿No tienes cuenta? Crea una</a>
            </div>
            <div class="back-home">
                <a href="../index.html">← Volver al inicio</a>
            </div>
        </section>
    </main>

    <script src="../js/login.js"></script>
</body>
</html>

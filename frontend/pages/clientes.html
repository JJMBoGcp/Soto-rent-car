<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | Soto Rent Car</title>
    <link rel="icon" type="image/png" href="/assets/img/ChatGPT Image 11 may 2026, 22_47_30.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/clientes.css">
</head>
<body class="admin-page">

    <header class="admin-header">
        <a href="../index.html" class="admin-logo">
            <img src="/assets/img/ChatGPT Image 11 may 2026, 22_47_30.png" alt="Soto Rent Car">
            <span>Soto Rent Car</span>
        </a>
        <nav class="admin-nav">
             <a href="vehiculos.html">Vehículos</a>
            <a href="clientes.html">Clientes</a>
            <a href="reservas.html">Reservas</a>
            <a href="pagos.html" class="active">Pagos</a>
            <a href="usuarios.html">Usuarios</a>
            <a href="dashboard.html">Panel de control</a>
        </nav>
    </header>

    <main class="admin-main">
        <div class="admin-toolbar">
            <div>
                <h1>Clientes</h1>
                <p>Gestiona los clientes registrados en el sistema.</p>
            </div>
            <button class="btn-primary" id="btn-nuevo">+ Nuevo cliente</button>
        </div>

        <input
            type="text"
            id="buscar-cliente"
            class="buscar-input"
            placeholder="Buscar por nombre, correo o teléfono..."
        >

        <div class="table-wrapper">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Licencia</th>
                        <th>Dirección</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="clientes-lista">
                    <tr>
                        <td colspan="7" class="loading">Cargando clientes...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- ================= MODAL ================= -->
    <div class="modal" id="modal-cliente">
        <div class="modal-content">
            <div class="modal-header-row">
                <h2 id="modal-title">Nuevo cliente</h2>
                <button class="btn-cerrar" id="btn-cerrar-modal">&times;</button>
            </div>

            <form id="cliente-form">
                <input type="hidden" id="id_cliente">
                <input type="hidden" id="id_usuario">

                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" required>
                </div>

                <div class="form-group" id="grupo-contrasena">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena">
                    <small class="ayuda-campo">Solo requerida al crear un cliente nuevo.</small>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="text" id="telefono" placeholder="809-000-0000">
                    </div>
                    <div class="form-group">
                        <label for="licencia">Licencia</label>
                        <input type="text" id="licencia">
                    </div>
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion">
                </div>

                <p id="form-message" class="form-message"></p>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/clientes.js"></script>
</body>
</html>
